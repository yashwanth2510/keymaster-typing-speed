name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: |
          ls node_modules/@types 2>/dev/null || echo "NO @types dir"
          ls node_modules/react | head -20
          node -e "const p=require('react/package.json');console.log('react.types=',p.types,'|main=',p.main)"
          npx tsc --noEmit --traceResolution src/main.tsx 2>&1 | grep -iE "react.*\.d\.ts|@types/react|node_modules/react/re" | sort -u | head -30 || true
          npm run lint

      - name: Build (front-end only, repo sub-path base)
        run: npx vite build --base=/keymaster-typing-speed/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4